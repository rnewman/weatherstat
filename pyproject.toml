[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weatherstat"
version = "0.1.0"
description = "Physics-based HVAC control: system identification, forward simulation, trajectory sweep"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "paho-mqtt>=2.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scipy>=1.14",
]

[project.optional-dependencies]
tui = [
    "textual>=1.0",
]

# A dependency group (not an extra) so every `uv run` syncs it: `just test` works
# on a fresh checkout instead of falling through to whatever pytest is on PATH.
[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
]

[tool.uv]
# Only resolve releases that have been public for a week (supply-chain cooldown).
# Project-level so every machine locks the same way and none strips it from uv.lock.
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/weatherstat"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 180

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
